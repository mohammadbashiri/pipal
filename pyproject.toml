[project]
name = "pipal"
version = "0.2.0"
description = "A persistent agent layer on top of pi-coding-agent"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Mo Bashiri", email = "mohammadbashiri93@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "rich>=14.3.3",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
pipal = "pipal.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: integration tests (need pi/pipal installed, run with: uv run pytest -m integration)",
]
addopts = "-m 'not integration'"

[build-system]
requires = ["uv_build>=0.9.16,<0.10.0"]
build-backend = "uv_build"
