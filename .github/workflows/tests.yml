name: tests

on:
  push:
  pull_request:

env:
  PI_VERSION: "latest"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v3

      - name: Install pi
        run: npm install -g @mariozechner/pi-coding-agent@${{ env.PI_VERSION }}

      - name: Install pipal
        run: uv pip install -e . --system

      - name: Install dev dependencies
        run: uv pip install pytest httpx --system

      - name: Run unit tests
        run: pytest tests/ -v

      - name: Run integration tests
        run: pytest tests/ -v -m integration

      - name: Run pi compatibility check
        env:
          PIPAL_DOCTOR_SKIP_RUNTIME: "1"
        run: pipal check-pi-compatibility
